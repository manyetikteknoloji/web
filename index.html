<!-- SCRIPTS & INTERACTION LOGIC -->
<script>
  // Initialize Lucide Icons
  lucide.createIcons();

  // Mobile Menu Toggle
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');

  if (mobileMenuBtn && mobileMenu) {
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  }

  // LC Resonance Simulator Logic
  const lcSliderL = document.getElementById('lc-slider-l');
  const lcSliderC = document.getElementById('lc-slider-c');
  const lcSliderR = document.getElementById('lc-slider-r');
  const lcSliderF = document.getElementById('lc-slider-f');

  const lcValL = document.getElementById('lc-val-l');
  const lcValC = document.getElementById('lc-val-c');
  const lcValR = document.getElementById('lc-val-r');
  const lcValF = document.getElementById('lc-val-f');

  const lcTelemetryF0 = document.getElementById('lc-telemetry-f0');
  const lcTelemetryQ = document.getElementById('lc-telemetry-q');
  const lcTelemetryZ = document.getElementById('lc-telemetry-z');
  const lcTelemetryBw = document.getElementById('lc-telemetry-bw');

  const lcMatchBtn = document.getElementById('lc-match-btn');
  const lcResetBtn = document.getElementById('lc-reset-btn');
  const lcCanvas = document.getElementById('lcResonanceCanvas');

  function updateLCSimulator() {
    if (!lcCanvas) return;
    const L = parseFloat(lcSliderL.value) * 1e-6; // uH to H
    const C = parseFloat(lcSliderC.value) * 1e-9; // nF to F
    const R = parseFloat(lcSliderR.value); // Ohms
    const f = parseFloat(lcSliderF.value); // Hz

    // Calculated Resonance Values
    const f0 = 1 / (2 * Math.PI * Math.sqrt(L * C));
    const w0 = 2 * Math.PI * f0;
    const Q = (1 / R) * Math.sqrt(L / C);
    const bw = f0 / Q;

    // Impedance at frequency f
    const w = 2 * Math.PI * f;
    const XL = w * L;
    const XC = 1 / (w * C);
    const Z = Math.sqrt(R * R + Math.pow(XL - XC, 2));

    // Update UI text displays
    if (lcValL) lcValL.textContent = lcSliderL.value + ' µH';
    if (lcValC) lcValC.textContent = lcSliderC.value + ' nF';
    if (lcValR) lcValR.textContent = lcSliderR.value + ' Ω';
    if (lcValF) lcValF.textContent = (f >= 1000 ? (f / 1000).toFixed(2) + ' kHz' : f.toFixed(0) + ' Hz');

    if (lcTelemetryF0) lcTelemetryF0.textContent = (f0 >= 1000 ? (f0 / 1000).toFixed(2) + ' kHz' : f0.toFixed(0) + ' Hz');
    if (lcTelemetryQ) lcTelemetryQ.textContent = Q.toFixed(2);
    if (lcTelemetryZ) lcTelemetryZ.textContent = Z.toFixed(1) + ' Ω';
    if (lcTelemetryBw) lcTelemetryBw.textContent = (bw >= 1000 ? (bw / 1000).toFixed(2) + ' kHz' : bw.toFixed(0) + ' Hz');

    // Canvas Drawing
    const ctx = lcCanvas.getContext('2d');
    const width = lcCanvas.width = lcCanvas.clientWidth;
    const height = lcCanvas.height = lcCanvas.clientHeight;

    ctx.clearRect(0, 0, width, height);

    // Grid lines
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < width; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
    }
    for (let y = 0; y < height; y += 30) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
    }

    // Draw Response Curve
    ctx.beginPath();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2.5;

    const minF = Math.max(100, f0 * 0.1);
    const maxF = f0 * 2.5;

    for (let px = 0; px < width; px++) {
      const curF = minF + (px / width) * (maxF - minF);
      const curW = 2 * Math.PI * curF;
      const curXL = curW * L;
      const curXC = 1 / (curW * C);
      const curZ = Math.sqrt(R * R + Math.pow(curXL - curXC, 2));
      const currentRatio = R / curZ; // Normalized 0 to 1 peak at resonance

      const py = height - (currentRatio * (height - 30)) - 15;
      if (px === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Draw current frequency marker
    const markerX = ((f - minF) / (maxF - minF)) * width;
    if (markerX >= 0 && markerX <= width) {
      ctx.strokeStyle = '#06b6d4';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(markerX, 0);
      ctx.lineTo(markerX, height);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  if (lcSliderL) {
    [lcSliderL, lcSliderC, lcSliderR, lcSliderF].forEach(slider => {
      slider.addEventListener('input', updateLCSimulator);
    });

    lcMatchBtn.addEventListener('click', () => {
      const L = parseFloat(lcSliderL.value) * 1e-6;
      const C = parseFloat(lcSliderC.value) * 1e-9;
      const f0 = 1 / (2 * Math.PI * Math.sqrt(L * C));
      lcSliderF.value = Math.min(100000, Math.max(100, f0));
      updateLCSimulator();
    });

    lcResetBtn.addEventListener('click', () => {
      lcSliderL.value = 1450;
      lcSliderC.value = 140;
      lcSliderR.value = 12;
      lcSliderF.value = 11170;
      updateLCSimulator();
    });

    updateLCSimulator();
  }
</script>
